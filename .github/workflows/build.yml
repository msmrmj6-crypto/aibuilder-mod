name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Temporary: ground-truth the real API for spawning an entity with
      # equipment (for the upcoming /aievent command - geared-up mobs,
      # boss fights, etc) before writing real code against guessed names.
      - name: Debug - dump entity spawn/equipment API
        run: |
          ./gradlew compileJava --no-daemon --stacktrace || true
          JAR=$(find ~/.gradle/caches -iname "*.jar" | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/world/entity/EntityType.class" && echo {}' | head -1)
          echo "Found jar: $JAR"
          mkdir -p /tmp/extracted
          cd /tmp/extracted
          unzip -o "$JAR" "net/minecraft/world/entity/EntityType.class"
          unzip -o "$JAR" "net/minecraft/world/entity/LivingEntity.class"
          unzip -o "$JAR" "net/minecraft/world/entity/EquipmentSlot.class"
          unzip -o "$JAR" "net/minecraft/server/level/ServerLevel.class"
          unzip -o "$JAR" "net/minecraft/core/registries/BuiltInRegistries.class"
          unzip -o "$JAR" "net/minecraft/world/entity/Entity.class"
          echo "===== EntityType ====="
          javap -p net/minecraft/world/entity/EntityType.class
          echo "===== EquipmentSlot ====="
          javap -p net/minecraft/world/entity/EquipmentSlot.class
          echo "===== LivingEntity (equipment-related) ====="
          javap -p net/minecraft/world/entity/LivingEntity.class | grep -i "equip\|ItemSlot\|setItem"
          echo "===== Entity (position-related) ====="
          javap -p net/minecraft/world/entity/Entity.class | grep -i "setPos\|moveTo\|teleport"
          echo "===== ServerLevel (entity-related) ====="
          javap -p net/minecraft/server/level/ServerLevel.class | grep -i "entity\|spawn"
          echo "===== BuiltInRegistries (entity type field) ====="
          javap -p net/minecraft/core/registries/BuiltInRegistries.class | grep -i "entity"

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error

      # Actions artifacts (above) are only downloadable via a signed Azure Blob
      # Storage redirect, which is unreachable from some sandboxed/offline
      # environments. A GitHub Release asset is instead served directly from
      # GitHub's own infrastructure, so it stays downloadable everywhere. Keep
      # one rolling "latest-build" release updated on every push.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload latest-build build/libs/*.jar --repo "${{ github.repository }}" --clobber \
            || gh release create latest-build build/libs/*.jar --repo "${{ github.repository }}" \
                 --title "Latest build" --notes "Automated build from commit ${{ github.sha }}"
