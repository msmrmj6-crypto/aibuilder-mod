name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # TEMPORARY - removed before the feature commit lands. Compiles just
      # enough to pull Minecraft's real remapped jar into the Gradle cache,
      # then dumps the real API (via javap) for classes/methods we're about
      # to use for the first time, so we write against the real signatures
      # instead of guessing and burning a build cycle on a compile error.
      - name: Debug - dump new API surface
        run: |
          ./gradlew compileJava --no-daemon --stacktrace || true
          JAR=$(find ~/.gradle/caches -iname "*.jar" 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/world/entity/item/ItemEntity.class" && echo {}' | head -1)
          echo "Using jar: $JAR"
          WORK=/tmp/mcdump
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          unzip -o -q "$JAR" \
            "net/minecraft/world/entity/item/ItemEntity.class" \
            "net/minecraft/server/players/PlayerList.class" \
            "net/minecraft/world/entity/player/Player.class" \
            "net/minecraft/world/entity/player/Player\$*.class" \
            "net/minecraft/world/entity/Entity.class" \
            "net/minecraft/world/entity/LivingEntity.class" \
            "net/minecraft/world/entity/Mob.class" \
            "net/minecraft/world/Container.class" \
            "net/minecraft/world/entity/player/Inventory.class"
          echo "=== Abilities-related classes found ==="
          unzip -l "$JAR" | grep -i "Abilities"
          echo "=== ItemEntity ==="
          javap -p ItemEntity.class 2>&1 | head -40
          echo "=== PlayerList (getPlayerByName) ==="
          javap -p PlayerList.class 2>&1 | grep -i "byname\|getplayer"
          echo "=== Player (getAbilities) ==="
          javap -p Player.class 2>&1 | grep -i "abilities"
          echo "=== Entity (kill/remove) ==="
          javap -p Entity.class 2>&1 | grep -i "kill\|remove\|discard"
          echo "=== LivingEntity (kill) ==="
          javap -p LivingEntity.class 2>&1 | grep -i "kill"
          echo "=== Inventory (Container methods) ==="
          javap -p Inventory.class 2>&1 | head -60
        continue-on-error: true

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error

      # Actions artifacts (above) are only downloadable via a signed Azure Blob
      # Storage redirect, which is unreachable from some sandboxed/offline
      # environments. A GitHub Release asset is instead served directly from
      # GitHub's own infrastructure, so it stays downloadable everywhere. Keep
      # one rolling "latest-build" release updated on every push.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload latest-build build/libs/*.jar --repo "${{ github.repository }}" --clobber \
            || gh release create latest-build build/libs/*.jar --repo "${{ github.repository }}" \
                 --title "Latest build" --notes "Automated build from commit ${{ github.sha }}"
