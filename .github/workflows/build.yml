name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error
