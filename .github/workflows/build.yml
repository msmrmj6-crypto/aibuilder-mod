name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Temporary: resolve dependencies/remap Minecraft first (without compiling
      # our own source, which currently fails) so we can inspect the REAL
      # compiled CommandSourceStack class for 1.21.11's Mojang mappings and find
      # the actual permission-check method name, instead of guessing again.
      - name: Debug - dump CommandSourceStack API
        run: |
          ./gradlew compileJava --no-daemon --stacktrace || true
          JAR=$(find ~/.gradle/caches -iname "*.jar" | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/commands/CommandSourceStack.class" && echo {}' | head -1)
          echo "Found jar: $JAR"
          mkdir -p /tmp/extracted
          cd /tmp/extracted
          unzip -o "$JAR" "net/minecraft/commands/CommandSourceStack.class"
          javap -p net/minecraft/commands/CommandSourceStack.class

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error
