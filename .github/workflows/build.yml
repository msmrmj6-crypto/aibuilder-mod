name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Temporary: ground-truth the real API for CommandBlockEntity / its
      # inner command-holder object, specifically how to toggle "Always
      # Active" (auto) mode, so a multi-item kit can be built as a real
      # chain of command blocks instead of one overloaded command string.
      - name: Debug - dump CommandBlockEntity API
        run: |
          ./gradlew compileJava --no-daemon --stacktrace || true
          JAR=$(find ~/.gradle/caches -iname "*.jar" | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/world/level/block/entity/CommandBlockEntity.class" && echo {}' | head -1)
          echo "Found jar: $JAR"
          mkdir -p /tmp/extracted
          cd /tmp/extracted
          unzip -o "$JAR" "net/minecraft/world/level/block/entity/CommandBlockEntity.class"
          unzip -o "$JAR" "net/minecraft/world/level/BaseCommandBlock.class"
          unzip -o "$JAR" "net/minecraft/world/level/block/CommandBlock.class"
          echo "===== CommandBlockEntity ====="
          javap -p net/minecraft/world/level/block/entity/CommandBlockEntity.class
          echo "===== BaseCommandBlock ====="
          javap -p net/minecraft/world/level/BaseCommandBlock.class
          echo "===== CommandBlock (the Block itself - state properties) ====="
          javap -p net/minecraft/world/level/block/CommandBlock.class

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error

      # Actions artifacts (above) are only downloadable via a signed Azure Blob
      # Storage redirect, which is unreachable from some sandboxed/offline
      # environments. A GitHub Release asset is instead served directly from
      # GitHub's own infrastructure, so it stays downloadable everywhere. Keep
      # one rolling "latest-build" release updated on every push.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload latest-build build/libs/*.jar --repo "${{ github.repository }}" --clobber \
            || gh release create latest-build build/libs/*.jar --repo "${{ github.repository }}" \
                 --title "Latest build" --notes "Automated build from commit ${{ github.sha }}"
