name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.19.x itself needs a JDK 25 runtime to execute, even
      # though the mod's own compiled bytecode still targets Java 21
      # (see build.gradle: JavaCompile release = 21), which is what
      # Minecraft 1.21.11 / fabric.mod.json actually require at runtime.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # TEMPORARY - removed before the feature commit lands. Ground-truths
      # the real Mojang-mapped API for weather control, day-time control, and
      # running an arbitrary vanilla command string programmatically, before
      # writing /aievent's new weather/time/immediateCommands support against
      # them (same technique used for every previous API this mod needed).
      - name: Debug - dump new API surface 2
        run: |
          set +e
          ./gradlew compileJava --no-daemon --stacktrace || true
          JAR=$(find ~/.gradle/caches -iname "*.jar" 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/world/level/Level.class" && echo {}' | head -1)
          echo "Using jar: $JAR"
          WORK=/tmp/mcdump2
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"

          mapfile -t TARGETS < <(unzip -l "$JAR" | awk '{print $4}' | grep -E "server/level/ServerLevel\.class$|world/level/Level\.class$|commands/Commands\.class$")
          echo "=== matched targets ==="
          printf '%s\n' "${TARGETS[@]}"

          for t in "${TARGETS[@]}"; do
            unzip -o -q "$JAR" "$t"
          done

          echo "=== ServerLevel (weather) ==="
          javap -p net/minecraft/server/level/ServerLevel.class 2>&1 | grep -i "weather"
          echo "=== Level (day time) ==="
          javap -p net/minecraft/world/level/Level.class 2>&1 | grep -i "daytime"
          echo "=== Commands (perform/execute) ==="
          javap -p net/minecraft/commands/Commands.class 2>&1 | grep -i "perform\|execute"
        continue-on-error: true

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: aibuilder-mod
          path: build/libs/*.jar
          if-no-files-found: error

      # Actions artifacts (above) are only downloadable via a signed Azure Blob
      # Storage redirect, which is unreachable from some sandboxed/offline
      # environments. A GitHub Release asset is instead served directly from
      # GitHub's own infrastructure, so it stays downloadable everywhere. Keep
      # one rolling "latest-build" release updated on every push.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload latest-build build/libs/*.jar --repo "${{ github.repository }}" --clobber \
            || gh release create latest-build build/libs/*.jar --repo "${{ github.repository }}" \
                 --title "Latest build" --notes "Automated build from commit ${{ github.sha }}"
